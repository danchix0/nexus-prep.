<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS — платформа подготовки к экзаменам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090d16; --bg2:#0e121e; --solid:#111726;
  --glass:rgba(22,29,48,.58); --glass-2:rgba(255,255,255,.035);
  --line:rgba(140,160,225,.14); --line-2:rgba(140,160,225,.28);
  --text:#e8edf9; --muted:#95a1bd; --dim:#65718d;
  --blue:#4d7cff; --violet:#9b6bff; --mint:#2ee6a6; --red:#ff4d6d; --amber:#ffb84d;
  --grad:linear-gradient(135deg,#4d7cff 0%,#9b6bff 100%);
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --display:'Unbounded','Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
@media(min-width:1800px){html{font-size:19px}}
@media(min-width:2400px){html{font-size:22px}}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.ico{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- фон ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,#141b33 0%,transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42}
.o1{width:520px;height:520px;background:#3552d6;top:-160px;right:-80px}
.o2{width:460px;height:460px;background:#6c3bd6;bottom:-180px;left:22%;opacity:.28}
.o3{width:340px;height:340px;background:#0f8f6c;top:44%;right:8%;opacity:.16}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(140,160,225,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(140,160,225,.06) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 60% 20%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 60% 20%,#000 0%,transparent 70%)}

/* ---------- каркас ---------- */
.app{position:relative;z-index:1;display:flex;height:100%}
.sidebar{width:21rem;flex:none;display:flex;flex-direction:column;background:rgba(9,13,24,.7);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-right:1px solid var(--line);min-height:0}
.brand{display:flex;align-items:center;gap:.75rem;padding:1.1rem 1.1rem .6rem}
.logo{width:2.4rem;height:2.4rem;border-radius:.8rem;background:var(--grad);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.05rem;box-shadow:0 0 28px -4px rgba(105,110,255,.75)}
.brand b{font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:1rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.search{position:relative;margin:.6rem 1.1rem .5rem}
.search .ico{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.05rem}
.search input{width:100%;height:2.8rem;padding:0 2.6rem 0 2.5rem;border-radius:.9rem;border:1px solid var(--line-2);background:rgba(255,255,255,.04);outline:none;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,124,255,.22)}
.search kbd{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.72rem;color:var(--dim);border:1px solid var(--line-2);border-radius:.4rem;padding:.05rem .4rem}
.filters{padding:0 1.1rem .4rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.45rem}
.chips.tags{max-height:5.4rem;overflow-y:auto;padding-right:.2rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;min-height:2rem;padding:.2rem .7rem;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--muted);font-size:.8rem;cursor:pointer;transition:.2s var(--ease)}
.chip:hover{color:var(--text);border-color:rgba(77,124,255,.6);box-shadow:0 0 18px -6px rgba(77,124,255,.8)}
.chip.on{color:#fff;background:rgba(77,124,255,.22);border-color:var(--blue)}
.chip.fav.on{background:rgba(255,184,77,.16);border-color:var(--amber);color:var(--amber)}
.chip.pri{background:var(--grad);border-color:transparent;color:#fff}
.chip:disabled{opacity:.4;cursor:default;box-shadow:none}
.navlinks{display:flex;gap:.4rem;padding:.2rem 1.1rem .5rem}
.navlinks a{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.6rem;border-radius:.8rem;border:1px solid var(--line);color:var(--muted);font-size:.86rem;transition:.2s}
.navlinks a:hover{color:var(--text);border-color:var(--line-2)}
.navlinks a.on{color:#fff;background:rgba(77,124,255,.16);border-color:rgba(77,124,255,.5)}
.tree{flex:1;overflow-y:auto;padding:.3rem .7rem 1.5rem;min-height:0}
.tree-count{padding:.3rem .5rem .6rem;color:var(--muted);font-size:.8rem}
.course{margin-bottom:.5rem;border-radius:1rem}
.course-h,.mod-h{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:0;cursor:pointer;text-align:left;border-radius:.8rem;transition:background .2s}
.course-h{padding:.6rem .5rem;min-height:2.9rem}
.course-h:hover,.mod-h:hover{background:rgba(255,255,255,.04)}
.c-ico{width:2rem;height:2rem;border-radius:.65rem;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);font-size:1.05rem;flex:none}
.course-h .t{flex:1;font-weight:600;font-size:.92rem;line-height:1.25}
.course-h em,.mod-h em{font-style:normal;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.chev{transition:transform .25s var(--ease);color:var(--dim);font-size:.9rem}
.open>.course-h .chev,.mod.open>.mod-h .chev{transform:rotate(90deg)}
.course>.course-b,.mod>.mod-b{display:none}
.course.open>.course-b,.mod.open>.mod-b{display:block}
.course-b{padding:.1rem 0 .2rem .6rem}
.mod-h{padding:.4rem .5rem;min-height:2.4rem;color:var(--muted);font-size:.84rem}
.mod-h span{flex:1}
.mod-b{padding-left:.4rem}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--grad);transition:width .8s var(--ease)}
.bar.sm{height:4px}
.mod-b>.bar{margin:.1rem .5rem .35rem}
.ll{display:flex;align-items:center;gap:.2rem;border-radius:.8rem;transition:background .2s}
.ll:hover{background:rgba(255,255,255,.04)}
.ll.active{background:linear-gradient(90deg,rgba(77,124,255,.2),rgba(155,107,255,.08));box-shadow:inset 2px 0 0 var(--blue)}
.ll-a{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;padding:.55rem .5rem;min-height:2.6rem;font-size:.88rem}
.ll-t{flex:1;min-width:0;line-height:1.3}
.dot{width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:.7rem;transition:.3s}
.dot.done{background:var(--mint);border-color:var(--mint);color:#04241a;box-shadow:0 0 14px -2px rgba(46,230,166,.7)}
.score{font-family:var(--mono);font-size:.7rem;padding:.05rem .4rem;border-radius:.4rem}
.score.ok{color:var(--mint);background:rgba(46,230,166,.1)}
.score.lo{color:var(--amber);background:rgba(255,184,77,.1)}
.ic-btn{display:inline-grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:.8rem;border:0;background:none;color:var(--dim);cursor:pointer;transition:.2s;flex:none;font-size:1.1rem}
.ic-btn:hover{color:var(--text);background:rgba(255,255,255,.06)}
.ic-btn.bm.on{color:var(--amber)}
.ic-btn.bm.on .ico{fill:currentColor}
.scrim{display:none}

/* ---------- main ---------- */
.main{flex:1;min-width:0;overflow-y:auto;position:relative;transition:margin-right .35s var(--ease);scroll-behavior:smooth}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.8rem;min-height:3.7rem;padding:.5rem 1.4rem;background:rgba(9,13,22,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.menu-btn{display:none}
.crumb{flex:1;min-width:0;color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--dim);margin:0 .3rem}
.pill{display:flex;align-items:center;gap:.6rem;padding:.35rem .8rem;border-radius:99px;border:1px solid var(--line-2);background:var(--glass-2);font-size:.82rem;color:var(--muted)}
.pill b{font-family:var(--mono);color:var(--text)}
.pill .bar{width:64px}
.rp{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.rp i{display:block;height:100%;width:0;background:var(--grad);box-shadow:0 0 12px rgba(105,110,255,.9)}
.wrap{max-width:58rem;margin:0 auto;padding:2rem 1.5rem 6rem}
.wrap.wide{max-width:76rem}
h1,h2,h3{margin:0;line-height:1.2}
.ltitle{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3.2vw,2.2rem);letter-spacing:-.01em;margin:.4rem 0 .8rem}
.eyebrow{color:var(--muted);font-size:.86rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:1rem;color:var(--muted);font-size:.86rem}
.meta .tg{padding:.1rem .6rem;border-radius:99px;background:rgba(155,107,255,.14);border:1px solid rgba(155,107,255,.32);color:#cdb8ff;font-size:.78rem}
.lact{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.9rem;padding:.55rem 1.15rem;border-radius:.9rem;border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-weight:500;transition:.25s var(--ease)}
.btn:hover{border-color:rgba(77,124,255,.7);box-shadow:0 0 0 1px rgba(77,124,255,.4),0 10px 34px -10px rgba(77,124,255,.7);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 30px -12px rgba(105,110,255,.9)}
.btn.primary:hover{box-shadow:0 0 0 1px rgba(155,107,255,.8),0 14px 40px -8px rgba(125,110,255,.95)}
.btn.success{border-color:rgba(46,230,166,.6);color:var(--mint);background:rgba(46,230,166,.1)}
.btn.on{border-color:rgba(255,184,77,.6);color:var(--amber);background:rgba(255,184,77,.1)}
.btn.on .ico{fill:currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.danger:hover{border-color:var(--red);box-shadow:0 0 0 1px rgba(255,77,109,.5),0 10px 30px -10px rgba(255,77,109,.7)}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1.6rem;scroll-margin-top:4.5rem}
.tab{display:flex;align-items:center;gap:.5rem;min-height:2.9rem;padding:.4rem 1.1rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{color:#fff;border-color:var(--blue);text-shadow:0 0 18px rgba(77,124,255,.9)}
.tab .score{margin-left:.2rem}

/* ---------- контент уроков ---------- */
.prose h2{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:2.2rem 0 .8rem}
.prose h2:first-child{margin-top:.4rem}
.prose p{margin:.7rem 0;max-width:68ch;font-size:1.02rem}
.prose ul,.prose ol{margin:.7rem 0;padding-left:1.3rem;max-width:68ch}
.prose li{margin:.35rem 0}
.prose li::marker{color:var(--blue)}
code{font-family:var(--mono);font-size:.88em;padding:.1em .4em;border-radius:.4rem;background:rgba(155,107,255,.14);color:#d4c4ff}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .14em;font-size:.9em;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .22em .06em}
.fr>span:last-child{padding:.06em .22em 0}
sup,sub{line-height:0;font-size:.72em}
.box{position:relative;margin:1.2rem 0;padding:.95rem 1.1rem .95rem 3.2rem;border-radius:1rem;border:1px solid;max-width:68ch}
.box>.bi{position:absolute;left:1.05rem;top:1.05rem;font-size:1.2rem}
.box p{margin:0}
.box .bt{font-weight:600;margin-bottom:.15rem;display:block}
.info-box{background:rgba(77,124,255,.08);border-color:rgba(77,124,255,.38)}.info-box .bi{color:var(--blue)}
.warning-box{background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.42)}.warning-box .bi{color:var(--red)}
.key-box{background:rgba(46,230,166,.07);border-color:rgba(46,230,166,.36);max-width:none}.key-box .bi{color:var(--mint)}
.key-box ul{margin:.4rem 0 0;padding-left:1.1rem}
.dictionary-box{background:rgba(155,107,255,.07);border-color:rgba(155,107,255,.38);padding-left:1.1rem;max-width:none}
.dictionary-box .dh{display:flex;align-items:center;gap:.5rem;color:#cdb8ff;font-weight:600;margin-bottom:.6rem}
.dict-row{display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:.8rem;padding:.5rem 0;border-top:1px solid rgba(155,107,255,.18);align-items:baseline}
.dict-row .sk{font-family:var(--mono);font-weight:500;color:#e6dcff}
.dict-row .en{color:var(--muted);font-style:italic}
.formula{margin:1.1rem 0;padding:1.1rem 1.2rem;border-radius:1rem;text-align:center;font-size:1.2rem;background:linear-gradient(135deg,rgba(77,124,255,.12),rgba(155,107,255,.1));border:1px solid var(--line-2);overflow-x:auto}
.tbl{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:1rem;background:var(--glass-2)}
table{border-collapse:collapse;width:100%;min-width:30rem;font-size:.94rem}
th,td{padding:.7rem 1rem;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:.82rem;background:rgba(255,255,255,.03)}
tr:last-child td{border-bottom:0}
pre.code{position:relative;margin:1.1rem 0;padding:1rem 1.1rem;border-radius:1rem;background:#070a12;border:1px solid var(--line);overflow-x:auto;font-family:var(--mono);font-size:.86rem;line-height:1.65;max-width:100%}
pre.code code{background:none;padding:0;color:#d5def5;font-size:inherit}
pre.code .lang{position:absolute;right:.8rem;top:.5rem;font-size:.7rem;color:var(--dim)}
.t-c{color:#66739a;font-style:italic}.t-s{color:#7ee2b8}.t-k{color:#a996ff}.t-n{color:var(--amber)}
.cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;margin-top:2.2rem;padding:1.2rem 1.4rem;border-radius:1.2rem;background:linear-gradient(135deg,rgba(77,124,255,.16),rgba(155,107,255,.14));border:1px solid var(--line-2)}
.cta b{font-family:var(--display);font-weight:500;font-size:1.05rem;display:block}
.cta span{color:var(--muted);font-size:.9rem}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-top:2rem}
.pg{display:flex;flex-direction:column;gap:.15rem;padding:.9rem 1.1rem;border-radius:1rem;border:1px solid var(--line);background:var(--glass-2);transition:.25s var(--ease);min-height:4rem}
.pg:hover{border-color:rgba(77,124,255,.6);box-shadow:0 10px 30px -14px rgba(77,124,255,.8)}
.pg small{color:var(--muted);font-size:.78rem}
.pg.next{text-align:right;grid-column:2}
.pg.next{align-items:flex-end}

/* ---------- главная ---------- */
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:2rem;align-items:center;padding:2.4rem;border-radius:1.8rem;background:var(--glass);border:1px solid var(--line-2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 30px 80px -40px rgba(60,80,230,.6)}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3.4vw,2.6rem);letter-spacing:-.02em;line-height:1.15}
.lead{color:var(--muted);max-width:52ch;margin:.9rem 0 1.4rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:.7rem}
.stats{display:flex;flex-wrap:wrap;gap:1.6rem;margin-top:1.8rem}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:1.5rem}
.stat span{color:var(--muted);font-size:.82rem}
.ring{position:relative;width:min(100%,15rem);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 18px rgba(105,110,255,.55))}
.ring .trk{stroke:rgba(255,255,255,.07)}
.ring .arc{transition:stroke-dashoffset 1.5s var(--ease)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,5vw,3.4rem);line-height:1}
.ring-c span{color:var(--muted);font-size:.84rem;margin-top:.4rem}
.sec{font-family:var(--display);font-weight:500;font-size:1.15rem;margin:2.4rem 0 1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1.1rem}
.card{position:relative;padding:1.3rem;border-radius:1.4rem;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:.3s var(--ease)}
.card:hover{border-color:color-mix(in srgb,var(--c,#4d7cff) 60%,transparent);box-shadow:0 20px 50px -24px var(--c,#4d7cff)}
.card h3{font-family:var(--display);font-weight:500;font-size:1rem;margin:.9rem 0 .3rem}
.card p{margin:0 0 1rem;color:var(--muted);font-size:.9rem}
.card .c-ico{width:2.6rem;height:2.6rem;font-size:1.3rem}
.card .prog{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin:.9rem 0 .4rem}
.card .prog b{font-family:var(--mono);color:var(--text);font-weight:500}
.card .bar i{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff))}
.mrow{display:grid;grid-template-columns:1fr 4.5rem 2.6rem;gap:.7rem;align-items:center;margin-top:.55rem;font-size:.84rem;color:var(--muted)}
.mrow em{font-style:normal;font-family:var(--mono);text-align:right;font-size:.76rem}
.card .btn{width:100%;margin-top:1.1rem}
.list{display:flex;flex-direction:column;gap:.6rem}
.row{display:flex;align-items:center;gap:1rem;padding:.9rem 1.1rem;border-radius:1rem;border:1px solid var(--line);background:var(--glass-2);transition:.25s var(--ease);min-height:3.4rem}
.row:hover{border-color:rgba(77,124,255,.55);box-shadow:0 10px 30px -16px rgba(77,124,255,.8)}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted)}
.empty{padding:2rem 1.4rem;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:1.2rem}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:.3rem}
.foot{display:flex;justify-content:flex-end;margin-top:2.4rem}

/* ---------- тест ---------- */
.qbox{max-width:48rem}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.7rem;color:var(--muted);font-size:.88rem}
.qhead .r{display:flex;align-items:center;gap:.7rem}
.qtimer{font-family:var(--mono);color:var(--text);min-width:3.2rem;text-align:right}
.segs{display:flex;gap:.35rem;margin-bottom:1.2rem}
.seg{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);transition:.4s}
.seg.ok{background:var(--mint);box-shadow:0 0 10px rgba(46,230,166,.6)}
.seg.bad{background:var(--red);box-shadow:0 0 10px rgba(255,77,109,.6)}
.seg.cur{background:var(--blue);box-shadow:0 0 10px rgba(77,124,255,.7)}
.qcard{padding:1.5rem;border-radius:1.5rem;background:var(--glass);border:1px solid var(--line-2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.qcard.res-ok{border-color:rgba(46,230,166,.55);box-shadow:0 0 50px -20px rgba(46,230,166,.7)}
.qcard.res-bad{border-color:rgba(255,77,109,.55);box-shadow:0 0 50px -20px rgba(255,77,109,.7);animation:shake .45s}
.qtype{color:var(--muted);font-size:.8rem;margin-bottom:.5rem}
.qtext{font-size:1.2rem;font-weight:600;line-height:1.45;margin-bottom:1.1rem}
.opts{display:flex;flex-direction:column;gap:.65rem}
.opt{display:flex;align-items:center;gap:.9rem;width:100%;min-height:3.4rem;padding:.7rem 1rem;text-align:left;border-radius:1rem;border:1px solid var(--line-2);background:rgba(255,255,255,.03);cursor:pointer;transition:.22s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--blue);box-shadow:0 0 0 1px rgba(77,124,255,.4),0 8px 28px -12px rgba(77,124,255,.8);transform:translateX(3px)}
.opt .key{width:1.9rem;height:1.9rem;border-radius:.55rem;display:grid;place-items:center;font-family:var(--mono);font-size:.82rem;border:1px solid var(--line-2);color:var(--muted);flex:none;transition:.2s}
.opt.multi .key{border-radius:.4rem}
.opt.sel{border-color:var(--blue);background:rgba(77,124,255,.12)}
.opt.sel .key{background:var(--blue);border-color:var(--blue);color:#fff}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--mint);background:rgba(46,230,166,.13);animation:pop .55s var(--ease)}
.opt.correct .key{background:var(--mint);border-color:var(--mint);color:#04241a}
.opt.wrong{border-color:var(--red);background:rgba(255,77,109,.13);animation:shake .45s}
.opt.wrong .key{background:var(--red);border-color:var(--red);color:#fff}
.opt.dim{opacity:.5}
.ansin{display:flex;align-items:center;border-radius:1rem;border:1px solid var(--line-2);background:rgba(255,255,255,.04);transition:.2s;overflow:hidden}
.ansin:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,124,255,.22)}
.ansin input{flex:1;height:3.4rem;padding:0 1.1rem;background:none;border:0;outline:none;font-family:var(--mono);font-size:1.05rem}
.ansin.ok{border-color:var(--mint);background:rgba(46,230,166,.1);animation:pop .55s var(--ease)}
.ansin.bad{border-color:var(--red);background:rgba(255,77,109,.1);animation:shake .45s}
.fb{margin-top:1.1rem;padding:.9rem 1.1rem;border-radius:1rem;border:1px solid;font-size:.95rem}
.fb b{display:block;font-size:1rem;margin-bottom:.15rem}
.fb.ok{background:rgba(46,230,166,.08);border-color:rgba(46,230,166,.4)}.fb.ok b{color:var(--mint)}
.fb.bad{background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.4)}.fb.bad b{color:var(--red)}
.fb .btn{margin-top:.7rem;min-height:2.6rem}
.qact{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-top:1.3rem;flex-wrap:wrap}
.qact .hintx{color:var(--dim);font-size:.82rem}
.res{text-align:center;padding:2rem 1.5rem}
.res .ring{width:11rem;margin-bottom:1rem}
.res h3{font-family:var(--display);font-weight:500;font-size:1.3rem;margin-bottom:.4rem}
.res p{color:var(--muted);margin:.2rem 0}
.res .acts{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.4rem}
.review{margin-top:1.6rem;text-align:left;display:flex;flex-direction:column;gap:.5rem}
.rv{display:flex;gap:.8rem;align-items:flex-start;padding:.7rem .9rem;border-radius:.9rem;border:1px solid var(--line);font-size:.9rem}
.rv .st{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;flex:none;font-size:.8rem}
.rv.ok .st{background:var(--mint);color:#04241a}.rv.bad .st{background:var(--red);color:#fff}
.rv small{display:block;color:var(--muted)}

/* ---------- ИИ-тьютор ---------- */
.tutor{position:fixed;top:0;right:0;bottom:0;width:26rem;max-width:100vw;z-index:60;display:flex;flex-direction:column;background:rgba(12,16,29,.9);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-left:1px solid rgba(155,107,255,.4);box-shadow:-30px 0 80px -30px rgba(120,90,255,.6);transform:translateX(105%);transition:transform .4s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tutor.open{transform:none}
.t-head{display:flex;align-items:center;gap:.8rem;padding:1rem 1rem .8rem 1.2rem;border-bottom:1px solid var(--line)}
.t-av{width:2.6rem;height:2.6rem;border-radius:50%;background:radial-gradient(circle at 30% 30%,#c9b6ff,#7a5cff 45%,#2f4fd8 100%);box-shadow:0 0 26px rgba(140,110,255,.8);display:grid;place-items:center;flex:none;animation:breathe 3s ease-in-out infinite}
.t-head b{display:block;font-family:var(--display);font-weight:500;font-size:.95rem;line-height:1.2}
.t-head small{color:var(--muted)}
.t-head .ic-btn{margin-left:auto}
.t-body{flex:1;overflow-y:auto;padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.75rem;min-height:0}
.tm{max-width:94%;padding:.75rem .95rem;border-radius:1rem 1rem 1rem .3rem;background:rgba(155,107,255,.1);border:1px solid rgba(155,107,255,.3);font-size:.93rem;line-height:1.55;animation:rise .35s var(--ease)}
.tm.step{background:rgba(77,124,255,.09);border-color:rgba(77,124,255,.34)}
.tm.fm{background:linear-gradient(135deg,rgba(77,124,255,.14),rgba(155,107,255,.14));text-align:center;font-size:1.1rem;max-width:100%}
.tm.hint{background:rgba(255,184,77,.08);border-color:rgba(255,184,77,.4)}
.tm.final{background:rgba(46,230,166,.08);border-color:rgba(46,230,166,.4)}
.tm-h{font-size:.74rem;color:var(--muted);margin-bottom:.2rem}
.tm.typing{display:flex;gap:.3rem;width:4rem;padding:.9rem 1rem}
.tm.typing i{width:.45rem;height:.45rem;border-radius:50%;background:#b9a4ff;animation:blink 1s infinite}
.tm.typing i:nth-child(2){animation-delay:.15s}.tm.typing i:nth-child(3){animation-delay:.3s}
.t-chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:.8rem 1.2rem 1rem;border-top:1px solid var(--line)}
.t-scrim{display:none}
@media(min-width:1200px){body.tutor-on .main{margin-right:26rem}}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
.toast{padding:.65rem 1.1rem;border-radius:99px;background:rgba(20,26,44,.95);border:1px solid var(--line-2);box-shadow:0 14px 40px -12px #000;font-size:.88rem;animation:rise .3s var(--ease)}

/* ---------- анимации ---------- */
@keyframes pop{0%{transform:scale(.985)}45%{transform:scale(1.02);box-shadow:0 0 0 8px rgba(46,230,166,.2)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- адаптив ---------- */
@media(max-width:900px){
  .menu-btn{display:inline-grid}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:70;width:min(88vw,22rem);transform:translateX(-102%);transition:transform .35s var(--ease);background:rgba(9,13,24,.96);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:30px 0 80px -30px #000}
  .sidebar.open{transform:none}
  .scrim,.t-scrim{display:block;position:fixed;inset:0;z-index:65;background:rgba(3,5,12,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.on,.t-scrim.on{opacity:1;pointer-events:auto}
  .t-scrim{z-index:55}
  .topbar{padding:.5rem .8rem}
  .pill span{display:none}
  .wrap{padding:1.3rem 1rem 5rem}
  .hero{grid-template-columns:1fr;padding:1.5rem;gap:1.4rem}
  .hero .ring{order:-1;width:11rem}
  .tutor{top:auto;left:0;right:0;width:100%;height:min(74vh,38rem);border-left:0;border-top:1px solid rgba(155,107,255,.5);border-radius:1.5rem 1.5rem 0 0;transform:translateY(105%)}
  .tutor.open{transform:none}
  .pager{grid-template-columns:1fr}
  .pg.next{grid-column:auto}
  .dict-row{grid-template-columns:1fr 1fr}
  .dict-row .sk{grid-column:1/-1}
  .qcard{padding:1.1rem}
  .qtext{font-size:1.08rem}
}
@media(max-width:480px){.pill .bar{display:none}.stats{gap:1.1rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(140,160,225,.2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(140,160,225,.35)}

<script>
"use strict";
/* =====================================================================
   БАЗА УРОКОВ
   Чтобы добавить урок — добавьте объект в modules[].lessons[].
   Верстку менять не нужно.

   Блоки урока (blocks):
     {t:"h", text}                      заголовок раздела
     {t:"p", text}                      абзац
     {t:"list"|"ol", items:[...]}       маркированный / нумерованный список
     {t:"info"|"warn", title?, text}    info-box / warning-box
     {t:"dict", items:[{sk,en,ru}]}     dictionary-box (словацкий / английский / русский)
     {t:"formula", text}                формула
     {t:"table", head:[...], rows:[[...]]}
     {t:"code", lang, code}             код с подсветкой
     {t:"key", title?, items:[...]}     ключевые тезисы
   Разметка в тексте: **жирный**, `код`, ^{степень}, _{индекс}, {{числитель|знаменатель}}

   Вопросы (quiz):
     {type:"single", q, options:[...], correct:[i]}
     {type:"multi",  q, options:[...], correct:[i,j,...]}
     {type:"input",  q, answers:[...], strict?, display?}
     q.code — необязательный листинг; explain — разбор для ИИ-Тьютора:
     explain:{hint, simple, steps:[...], formula?}
   ===================================================================== */
const DATABASE = {
  courses: [
    {
      id: "scio", short: "SCIO", title: "SCIO · Математика", color: "#4d7cff", icon: "calc",
      desc: "Числа, степени и проценты — база для вступительного теста.",
      modules: [
        { id: "arith", title: "Арифметика и алгебра", lessons: [
          {
            id: "frac", title: "Дроби: сокращение, сложение, умножение", minutes: 12,
            tags: ["SCIO", "Математика", "Дроби", "Арифметика"],
            blocks: [
              {t:"h", text:"Что такое дробь"},
              {t:"p", text:"Дробь {{a|b}} показывает, что целое разделили на **b** равных частей и взяли **a** из них. Число сверху — **числитель**, снизу — **знаменатель**. Знаменатель никогда не равен нулю."},
              {t:"dict", items:[
                {sk:"zlomok", en:"fraction", ru:"дробь"},
                {sk:"čitateľ", en:"numerator", ru:"числитель"},
                {sk:"menovateľ", en:"denominator", ru:"знаменатель"},
                {sk:"zmiešané číslo", en:"mixed number", ru:"смешанное число"},
                {sk:"krátiť zlomok", en:"to simplify a fraction", ru:"сократить дробь"},
                {sk:"spoločný menovateľ", en:"common denominator", ru:"общий знаменатель"}
              ]},
              {t:"h", text:"Сокращение дроби"},
              {t:"p", text:"Чтобы сократить дробь, разделите числитель и знаменатель на их **наибольший общий делитель (НОД)**. Пример: НОД(18, 24) = 6, поэтому {{18|24}} = {{3|4}}."},
              {t:"info", title:"Быстрый способ", text:"Если оба числа чётные, делите на 2 и повторяйте, пока не останется общих делителей."},
              {t:"h", text:"Сложение и вычитание"},
              {t:"formula", text:"{{a|b}} + {{c|d}} = {{a·d + c·b|b·d}}"},
              {t:"p", text:"Пример: {{3|4}} + {{5|6}}. Общий знаменатель — 12, значит {{9|12}} + {{10|12}} = {{19|12}} = 1{{7|12}}."},
              {t:"warn", title:"Знаменатели не складываются", text:"{{1|2}} + {{1|3}} ≠ {{2|5}}. Правильно: {{3|6}} + {{2|6}} = {{5|6}}."},
              {t:"h", text:"Умножение и деление"},
              {t:"formula", text:"{{a|b}} · {{c|d}} = {{a·c|b·d}}  ·  {{a|b}} : {{c|d}} = {{a|b}} · {{d|c}}"},
              {t:"p", text:"При делении вторую дробь переворачивают и заменяют деление умножением: {{2|3}} : {{4|9}} = {{2|3}} · {{9|4}} = {{18|12}} = {{3|2}}."},
              {t:"h", text:"Смешанные числа и сравнение"},
              {t:"p", text:"Смешанное число переводят в неправильную дробь так: целая часть · знаменатель + числитель. Например, 2{{1|3}} = {{2·3 + 1|3}} = {{7|3}}."},
              {t:"p", text:"Чтобы сравнить {{a|b}} и {{c|d}}, перемножьте крест-накрест: сравните **a·d** и **c·b**. Большее произведение — у большей дроби."},
              {t:"key", items:[
                "Сокращайте дробь на НОД — ответ должен быть несократимым.",
                "Складывать и вычитать можно только дроби с одинаковым знаменателем.",
                "Деление на дробь — это умножение на перевёрнутую дробь.",
                "Сравнивайте дроби приведением к общему знаменателю или крест-накрест."
              ]}
            ],
            quiz: [
              {type:"single", q:"Вычислите: {{2|3}} + {{1|6}}",
               options:["{{3|9}}","{{5|6}}","{{3|6}}","{{1|4}}"], correct:[1],
               explain:{hint:"Приведите обе дроби к знаменателю 6.",
                simple:"Сначала делаем «кусочки» одного размера, потом просто считаем кусочки.",
                steps:["Общий знаменатель: НОК(3, 6) = 6.","Приводим первую дробь: {{2|3}} = {{4|6}} (умножили числитель и знаменатель на 2).","Складываем числители, знаменатель оставляем: {{4|6}} + {{1|6}} = {{5|6}}.","Вариант {{3|9}} получается, если складывать числители и знаменатели отдельно, — так делать нельзя."],
                formula:"{{a|b}} + {{c|d}} = {{a·d + c·b|b·d}}"}},
              {type:"input", q:"Сократите дробь {{18|24}} до несократимой. Запишите ответ в виде a/b.",
               answers:["3/4"], strict:true,
               explain:{hint:"Найдите наибольшее число, на которое делятся и 18, и 24.",
                simple:"Делим верх и низ на одно и то же число, пока это возможно.",
                steps:["НОД(18, 24) = 6: оба числа делятся на 6 и нет большего общего делителя.","18 : 6 = 3, 24 : 6 = 4, получаем {{3|4}}.","НОД(3, 4) = 1, значит дальше сокращать нельзя. Если у вас вышло {{9|12}} или {{6|8}} — остановились слишком рано."]}},
              {type:"input", q:"Вычислите: {{3|4}} : {{3|8}}",
               answers:["2"],
               explain:{hint:"Деление заменяется умножением на перевёрнутую дробь.",
                simple:"Спрашиваем: сколько раз {{3|8}} помещается в {{3|4}}?",
                steps:["Переворачиваем вторую дробь и умножаем: {{3|4}} · {{8|3}}.","Сокращаем тройки: {{3|4}} · {{8|3}} = {{8|4}}.","{{8|4}} = 2."],
                formula:"{{a|b}} : {{c|d}} = {{a|b}} · {{d|c}}"}},
              {type:"multi", q:"Выберите все дроби, равные {{2|3}}.",
               options:["{{4|6}}","{{6|9}}","{{3|2}}","{{10|15}}","{{8|15}}"], correct:[0,1,3],
               explain:{hint:"Дробь не меняется, если числитель и знаменатель умножить на одно и то же число.",
                simple:"Ищем дроби, у которых числитель и знаменатель растут в одно и то же число раз.",
                steps:["{{2|3}} · 2 = {{4|6}}, ·3 = {{6|9}}, ·5 = {{10|15}} — эти три подходят.","{{3|2}} — перевёрнутая дробь, это совсем другое число (1,5).","{{8|15}}: 15 = 3·5, но 2·5 = 10, а не 8, поэтому дроби не равны."]}},
              {type:"single", q:"Переведите смешанное число 3{{2|5}} в неправильную дробь.",
               options:["{{17|5}}","{{32|5}}","{{6|5}}","{{11|5}}"], correct:[0],
               explain:{hint:"Целую часть умножьте на знаменатель и прибавьте числитель.",
                simple:"В трёх целых — 15 пятых, и ещё 2 пятых сверху.",
                steps:["3 · 5 = 15 — столько пятых в трёх целых.","Прибавляем числитель: 15 + 2 = 17.","Знаменатель остаётся 5: {{17|5}}."],
                formula:"n{{a|b}} = {{n·b + a|b}}"}},
              {type:"single", q:"Какая дробь больше: {{5|8}} или {{3|5}}?",
               options:["{{5|8}}","{{3|5}}","Они равны","Сравнить нельзя"], correct:[0],
               explain:{hint:"Приведите к общему знаменателю 40 или перемножьте крест-накрест.",
                simple:"Сравнивать удобно, когда «кусочки» одного размера.",
                steps:["Общий знаменатель 40: {{5|8}} = {{25|40}}, {{3|5}} = {{24|40}}.","25 > 24, поэтому {{5|8}} больше.","Проверка крест-накрест: 5·5 = 25 и 3·8 = 24 — тот же результат."],
                formula:"{{a|b}} ? {{c|d}} → a·d ? c·b"}}
            ]
          },
          {
            id: "pow", title: "Степени и корни", minutes: 14,
            tags: ["SCIO", "Математика", "Степени", "Алгебра"],
            blocks: [
              {t:"h", text:"Определение"},

/* Форматирование: **жирный**, `код`, ^{степень}, _{индекс}, {{числитель|знаменатель}} */
function fmt(t){
  let s = esc(t);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
  s = s.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
  s = s.replace(/\{\{([^|{}]+)\|([^{}]+)\}\}/g, '<span class="fr"><span>$1</span><span>$2</span></span>');
  return s.replace(/\n/g, "<br>");
}

/* Лёгкая подсветка кода (Python / JS / shell) */
function highlight(src){
  const re = /(#[^\n]*|\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|return|if|elif|else|for|while|in|range|import|from|print|let|const|function|True|False|None|and|or|not|console)\b|\b(\d[\d_]*(?:\.\d+)?)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : "n";
    out += `<span class="t-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

  return defaults();
}

function stats(items){
  let done = 0, tested = 0, ready = 0, sum = 0;
  items.forEach(it => {
    const id = it.lesson.id, r = state.results[id];
    if (state.done[id]) done++;
    if (r) { tested++; sum += r.best.pct; }
    ready += (state.done[id] ? 40 : 0) + (r ? r.best.pct * 0.6 : 0);
  });
  const n = items.length || 1;
  return { total: items.length, done, tested, avg: tested ? Math.round(sum / tested) : null,
           pct: Math.round(done / n * 100), ready: Math.round(ready / n) };
}

}

function matches(x){
  if (F.course && x.course.id !== F.course) return false;
  if (F.fav && !state.bookmarks[x.lesson.id]) return false;
  if (F.tag && x.lesson.tags.indexOf(F.tag) < 0) return false;
  if (F.q) {
    const words = F.q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.every(w => x.hay.indexOf(w) >= 0)) return false;
  }
  return true;
}

      <div class="prog"><span>Пройдено ${cs.done} из ${cs.total}</span><b>${cs.pct}%</b></div>
      <div class="bar"><i style="width:${cs.pct}%"></i></div>
      ${mods}
      <a class="btn" href="#/lesson/${first.lesson.id}">${cs.done ? "Продолжить курс" : "Начать курс"}</a>

  }).join("");

  let weakHTML;
  if (weak.length) {
    weakHTML = `<div class="list">${weak.map(x => `<a class="row" href="#/lesson/${x.lesson.id}/quiz"><div class="grow">${esc(x.lesson.title)}<small>${esc(x.course.title)}</small></div><span class="score lo">${state.results[x.lesson.id].best.pct}%</span></a>`).join("")}</div>`;
  } else if (untested) {
    weakHTML = `<div class="empty"><b>Слабых мест пока нет</b>Тестов ещё не пройдено: ${untested}. Результаты ниже 70% появятся здесь как темы для повторения.</div>`;
  } else {
    weakHTML = `<div class="empty"><b>Все темы выше 70%</b>Отличная работа — повторите уроки, где хочется добрать баллы.</div>`;
  }

  return `<div class="wrap wide">
    <section class="hero">
      <div>
        <h1>Учитесь, проверяйте себя, разбирайте ошибки</h1>
        <p class="lead">Уроки со словариками, тесты после каждой темы и ИИ-тьютор, который объясняет ошибку шаг за шагом. Готовность считается по изученным урокам и лучшим результатам тестов.</p>
        <div class="hero-actions">
          <a class="btn primary" href="#/lesson/${nxt.lesson.id}">${ico("play", 15)} ${allDone ? "Повторить" : started ? "Продолжить" : "Начать"}: ${esc(nxt.lesson.title)}</a>
          <a class="btn" href="#/bookmarks">${ico("star", 15)} Избранное${nbm ? " · " + nbm : ""}</a>
        </div>
        <div class="stats">
          <div class="stat"><b>${all.done} / ${all.total}</b><span>уроков изучено</span></div>
          <div class="stat"><b>${all.tested}</b><span>тестов пройдено</span></div>
          <div class="stat"><b>${all.avg === null ? "—" : all.avg + "%"}</b><span>средний результат</span></div>
        </div>
      </div>
      <div class="ring" role="img" aria-label="Готовность к экзамену: ${all.ready}%">
        <svg viewBox="0 0 220 220"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7cff"/><stop offset="1" stop-color="#2ee6a6"/></linearGradient></defs>
          <circle class="trk" cx="110" cy="110" r="88" fill="none" stroke-width="14"/>
          <circle class="arc" id="ringArc" data-c="${C}" data-v="${all.ready}" cx="110" cy="110" r="88" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
        </svg>
        <div class="ring-c"><b id="ringNum">0%</b><span>готовность</span></div>
      </div>
    </section>
    <h2 class="sec">Курсы</h2>
    <div class="grid">${courseCards}</div>
    <h2 class="sec">Что повторить</h2>
    ${weakHTML}
    <div class="foot"><button class="btn danger" id="resetBtn" data-act="reset">Сбросить прогресс</button></div>
  </div>`;
}

function animateRing(){
  const arc = $("#ringArc"), num = $("#ringNum");
  if (!arc) return;
  const C = +arc.dataset.c, v = +arc.dataset.v;
  requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDashoffset = C * (1 - v / 100); }));
  if (RM || !v) { num.textContent = v + "%"; return; }
  const t0 = performance.now(), dur = 1300;
  (function step(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    num.textContent = Math.round(v * e) + "%";
    if (k < 1 && document.body.contains(num)) requestAnimationFrame(step);
  })(t0);
}

/* =====================================================================
   ИЗБРАННОЕ

function bookmarksHTML(){

  const body = items.length
    ? `<div class="list">${items.map(x => `<div class="row"><a class="grow" href="#/lesson/${x.lesson.id}">${esc(x.lesson.title)}<small>${esc(x.course.title)} · ${esc(x.module.title)} · ${x.lesson.minutes} мин</small></a>
        <button class="ic-btn bm on" data-act="bm" data-id="${x.lesson.id}" aria-label="Убрать из избранного">${ico("star", 18)}</button></div>`).join("")}</div>`

  return `<div class="wrap"><h1 class="ltitle">Избранные уроки</h1><p class="eyebrow">Темы, к которым вы хотите вернуться.</p><div style="height:1rem"></div>${body}</div>`;

/* =====================================================================
   УРОК

function block(b){
  switch (b.t) {
    case "h": return `<h2>${fmt(b.text)}</h2>`;
    case "p": return `<p>${fmt(b.text)}</p>`;
    case "list": return `<ul>${b.items.map(i => `<li>${fmt(i)}</li>`).join("")}</ul>`;
    case "ol": return `<ol>${b.items.map(i => `<li>${fmt(i)}</li>`).join("")}</ol>`;
    case "info": return `<div class="box info-box"><span class="bi">${ico("info")}</span><p>${b.title ? `<span class="bt">${fmt(b.title)}</span>` : ""}${fmt(b.text)}</p></div>`;
    case "warn": return `<div class="box warning-box"><span class="bi">${ico("warn")}</span><p>${b.title ? `<span class="bt">${fmt(b.title)}</span>` : ""}${fmt(b.text)}</p></div>`;
    case "dict": return `<div class="box dictionary-box"><div class="dh">${ico("globe", 17)} Словарь: slovenčina · English · русский</div>${b.items.map(i => `<div class="dict-row"><span class="sk">${esc(i.sk)}</span><span class="en">${esc(i.en)}</span><span>${esc(i.ru)}</span></div>`).join("")}</div>`;
    case "formula": return `<div class="formula">${fmt(b.text)}</div>`;
    case "table": return `<div class="tbl"><table><thead><tr>${b.head.map(h => `<th>${fmt(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "code": return `<pre class="code"><span class="lang">${esc(b.lang || "")}</span><code>${highlight(b.code)}</code></pre>`;
    case "key": return `<div class="box key-box"><span class="bi">${ico("bolt")}</span><span class="bt">${fmt(b.title || "Ключевые тезисы")}</span><ul>${b.items.map(i => `<li>${fmt(i)}</li>`).join("")}</ul></div>`;
    default: return "";
  }
}

/* =====================================================================
   ДВИЖОК ТЕСТОВ
   ===================================================================== */
const curLesson = () => LMAP[R.id].lesson;
const curQ = () => Q && Q.phase !== "done" ? curLesson().quiz[Q.order[Q.pos]] : null;
const LETTERS = ["A","B","C","D","E","F"];

function normNum(s){
  s = String(s).trim().toLowerCase().replace(/[%€$\s]/g, "").replace(",", ".");
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)) { const p = s.split("/"); return +p[0] / +p[1]; }
  if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
  return NaN;
}
function checkInput(q, v){
  const raw = String(v).trim().toLowerCase().replace(/\s+/g, "");
  if (!raw) return false;
  return q.answers.some(a => {
    const A = String(a).toLowerCase();
    if (q.strict) return raw.replace(",", ".") === A;
    const na = normNum(A), nv = normNum(raw);
    if (!isNaN(na) && !isNaN(nv)) return Math.abs(na - nv) < 1e-6;
    return raw === A;
  });
}
function correctText(q){
  if (q.type === "input") return fmt(q.display || q.answers[0]);
  return q.correct.map(i => fmt(q.options[i])).join("; ");
}

let tmr = null;
function startTimer(){
  stopTimer();
  tmr = setInterval(() => {
    const el = $("#qtimer");
    if (el && Q && Q.phase !== "done") el.textContent = ts(Date.now() - Q.t0);
  }, 500);
}
function stopTimer(){ if (tmr) clearInterval(tmr); tmr = null; }

function startQuiz(order, full){
  const l = curLesson();
  Q = { order: order || l.quiz.map((_, i) => i), full: !!full, pos: 0, answers: [], sel: [], input: "", phase: "ask", t0: Date.now(), elapsed: 0 };
  tutorReset();
  renderQuiz(); startTimer();
  const t = $(".tabs"); if (t) t.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" });
}

function typeLabel(q){ return q.type === "single" ? "Один правильный ответ" : q.type === "multi" ? "Несколько правильных ответов" : "Введите ответ"; }

function renderQuiz(){
  const box = $("#quizBox"); if (!box) return;
  const l = curLesson();

  if (!Q) {
    const r = state.results[l.id];
    box.innerHTML = `<div class="qcard">
      <div class="qtype">Тест по уроку</div>
      <h3 class="qtext" style="margin-bottom:.6rem">${esc(l.title)}</h3>
      <p style="color:var(--muted);margin:0 0 1rem">${l.quiz.length} вопросов: выбор одного или нескольких вариантов и ввод ответа. Верный ответ подсветится зелёным, неверный — красным, а ИИ-тьютор разберёт ошибку по шагам. Порог зачёта — 70%.</p>
      ${r ? `<div class="fb ${r.best.pct >= 70 ? "ok" : "bad"}" style="margin:0 0 1rem"><b>Лучший результат: ${r.best.pct}%</b>Последняя попытка: ${r.last.correct} из ${r.last.total} · ${ts(r.last.time)} · попыток: ${r.attempts}</div>` : ""}
      <div class="qact">
        <button class="btn" data-act="timer-toggle">${ico("clock", 16)} Таймер: ${state.timer ? "вкл" : "выкл"}</button>
        <button class="btn primary" data-act="q-start">${ico("play", 15)} ${r ? "Пройти заново" : "Начать тест"}</button>
      </div>
      <p class="hintx" style="color:var(--dim);font-size:.82rem;margin:.9rem 0 0">Подсказка: варианты можно выбирать клавишами 1–4, а переходить дальше — клавишей Enter.</p>
    </div>`;
    return;
  }

  if (Q.phase === "done") { box.innerHTML = resultsHTML(l); animateResultRing(); return; }

  const qi = Q.order[Q.pos], q = l.quiz[qi], a = Q.answers[Q.pos];
  const total = Q.order.length;
  const okCount = Q.answers.filter(x => x && x.ok).length;
  const segs = Q.order.map((_, i) => `<span class="seg ${i < Q.pos || (i === Q.pos && a) ? (Q.answers[i].ok ? "ok" : "bad") : i === Q.pos ? "cur" : ""}"></span>`).join("");

  let body = "";
  if (q.type === "input") {
    body = `<div class="ansin ${a ? (a.ok ? "ok" : "bad") : ""}"><input id="qin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ваш ответ" value="${esc(Q.input)}" ${a ? "disabled" : ""} aria-label="Ваш ответ"></div>`;
  } else {
    body = `<div class="opts" role="${q.type === "single" ? "radiogroup" : "group"}">` + q.options.map((o, i) => {
      const sel = Q.sel.indexOf(i) >= 0;
      let cls = "opt" + (q.type === "multi" ? " multi" : "") + (sel ? " sel" : "");
      let mark = LETTERS[i];
      if (a) {
        const isC = q.correct.indexOf(i) >= 0;
        if (isC) { cls += " correct"; mark = ico("check", 14); }
        else if (sel) { cls += " wrong"; mark = ico("x", 14); }
        else cls += " dim";
      } else if (q.type === "multi" && sel) mark = ico("check", 14);
      return `<button class="${cls}" data-act="opt" data-i="${i}" ${a ? "disabled" : ""}><span class="key">${mark}</span><span>${fmt(o)}</span></button>`;
    }).join("") + `</div>`;
  }

  let fb = "";
  if (a) {
    fb = a.ok
      ? `<div class="fb ok" role="status"><b>Верно!</b>${q.explain.simple ? fmt(q.explain.simple) : ""}</div>`
      : `<div class="fb bad" role="status"><b>Неверно</b>Правильный ответ: ${correctText(q)}<br><button class="btn" data-act="t-open">${ico("sparkle", 16)} Разбор от ИИ-тьютора</button></div>`;
  }

  let act;
  const last = Q.pos + 1 >= total;
  if (a) act = `<span class="hintx">Enter — дальше</span><button class="btn primary" data-act="q-next">${last ? "Показать результат" : "Дальше"}</button>`;
  else if (q.type === "single") act = `<span class="hintx">Выберите вариант — ответ проверится сразу</span>`;
  else act = `<span class="hintx">${q.type === "multi" ? "Отметьте все верные варианты" : "Enter — проверить"}</span><button class="btn primary" data-act="q-check" ${q.type === "multi" && !Q.sel.length ? "disabled" : ""}>Проверить</button>`;

  box.innerHTML = `<div class="qhead"><span>Вопрос ${Q.pos + 1} из ${total} · верно: ${okCount}</span>
      <span class="r">${state.timer ? `<span class="qtimer" id="qtimer">${ts(Date.now() - Q.t0)}</span>` : ""}<button class="ic-btn" data-act="timer-toggle" style="width:2.2rem;height:2.2rem" aria-label="Показать или скрыть таймер">${ico("clock", 16)}</button></span></div>
    <div class="segs" aria-hidden="true">${segs}</div>
    <div class="qcard ${a ? (a.ok ? "res-ok" : "res-bad") : ""}">
      <div class="qtype">${typeLabel(q)}</div>
      <h3 class="qtext">${fmt(q.q)}</h3>
      ${q.code ? `<pre class="code"><code>${highlight(q.code)}</code></pre>` : ""}
      ${body}${fb}
      <div class="qact">${act}</div>
    </div>`;
  if (q.type === "input" && !a) setTimeout(() => { const i = $("#qin"); if (i) i.focus(); }, 30);
}

function submitAnswer(){
  if (!Q || Q.phase !== "ask") return;
  const q = curQ(); let ok = false, given = "";
  if (q.type === "single") {
    if (Q.sel.length !== 1) return;
    ok = q.correct.indexOf(Q.sel[0]) >= 0; given = q.options[Q.sel[0]];
  } else if (q.type === "multi") {
    if (!Q.sel.length) return;
    const s = Q.sel.slice().sort((a, b) => a - b).join(), c = q.correct.slice().sort((a, b) => a - b).join();
    ok = s === c; given = Q.sel.slice().sort((a, b) => a - b).map(i => q.options[i]).join("; ");
  } else {
    if (!Q.input.trim()) { toast("Введите ответ, чтобы проверить"); return; }
    ok = checkInput(q, Q.input); given = Q.input.trim();
  }
  Q.answers[Q.pos] = { qi: Q.order[Q.pos], ok, given };
  Q.phase = "checked";
  renderQuiz();
  if (!ok) setTimeout(() => tutorOpen(q, given), 380);
}

function pickOption(i){
  if (!Q || Q.phase !== "ask") return;
  const q = curQ(); if (!q || !q.options || i >= q.options.length) return;
  if (q.type === "single") { Q.sel = [i]; submitAnswer(); }
  else { const k = Q.sel.indexOf(i); if (k >= 0) Q.sel.splice(k, 1); else Q.sel.push(i); renderQuiz(); }
}

function nextQ(){
  if (!Q || Q.phase !== "checked") return;
  tutorReset();
  if (Q.pos + 1 >= Q.order.length) return finishQuiz();
  Q.pos++; Q.sel = []; Q.input = ""; Q.phase = "ask";
  renderQuiz();
  const t = $(".tabs"); if (t) t.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" });
}

function finishQuiz(){
  const l = curLesson();
  Q.phase = "done"; Q.elapsed = Date.now() - Q.t0; stopTimer();
  const total = Q.order.length, correct = Q.answers.filter(a => a.ok).length, pct = Math.round(correct / total * 100);
  Q.res = { correct, total, pct, newBest: false, markedDone: false };
  if (Q.full) {
    const rec = { pct, correct, total, time: Q.elapsed, date: Date.now() };
    const r = state.results[l.id] || { attempts: 0, best: null, last: null };
    r.attempts++; r.last = rec;
    if (!r.best || pct >= r.best.pct) { Q.res.newBest = !r.best || pct > r.best.pct; r.best = rec; }
    state.results[l.id] = r;
    if (pct >= 70 && !state.done[l.id]) { state.done[l.id] = true; Q.res.markedDone = true; }
    save(); renderTree(); renderTopbar(); renderNav();
    const lact = $("#lact"); if (lact) lact.innerHTML = actionsHTML(l);
  }
  renderQuiz();
}

function resultsHTML(l){
  const r = Q.res, C = 2 * Math.PI * 88;
  const col = r.pct >= 85 ? "#2ee6a6" : r.pct >= 70 ? "#4d7cff" : r.pct >= 40 ? "#ffb84d" : "#ff4d6d";
  const verdict = r.pct >= 85 ? "Отличный результат" : r.pct >= 70 ? "Тест сдан" : "Стоит повторить тему";
  const wrong = Q.answers.filter(a => !a.ok);
  const nx = FLAT[LMAP[l.id].idx + 1];
  const review = Q.answers.map((a, i) => {
    const q = l.quiz[a.qi];
    return `<div class="rv ${a.ok ? "ok" : "bad"}"><span class="st">${a.ok ? ico("check", 12) : ico("x", 12)}</span><div>${fmt(q.q)}${a.ok ? "" : `<small>Ваш ответ: ${fmt(a.given || "—")} · верно: ${correctText(q)}</small>`}</div></div>`;
  }).join("");
  return `<div class="qcard res">
    <div class="ring"><svg viewBox="0 0 220 220"><circle class="trk" cx="110" cy="110" r="88" fill="none" stroke-width="14"/>
      <circle class="arc" id="resArc" data-c="${C}" data-v="${r.pct}" cx="110" cy="110" r="88" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
      <div class="ring-c"><b>${r.pct}%</b><span>${r.correct} из ${r.total}</span></div></div>
    <h3>${verdict}</h3>
    <p>Время: ${ts(Q.elapsed)}${Q.full ? "" : " · повтор ошибок, результат не записывается"}</p>
    ${Q.res.markedDone ? `<p style="color:var(--mint)">Урок отмечен изученным.</p>` : ""}
    ${Q.res.newBest ? `<p style="color:var(--amber)">Новый лучший результат!</p>` : ""}
    <div class="acts">
      ${wrong.length ? `<button class="btn primary" data-act="q-wrong">${ico("refresh", 16)} Повторить ошибки (${wrong.length})</button>` : ""}
      <button class="btn" data-act="q-again">Пройти заново</button>
      <a class="btn" href="#/lesson/${l.id}">К теории</a>
      ${nx ? `<a class="btn ${wrong.length ? "" : "primary"}" href="#/lesson/${nx.lesson.id}">Следующий урок</a>` : ""}
    </div>
    <div class="review">${review}</div>
  </div>`;
}
function animateResultRing(){
  const a = $("#resArc"); if (!a) return;
  const C = +a.dataset.c, v = +a.dataset.v;
  requestAnimationFrame(() => requestAnimationFrame(() => { a.style.strokeDashoffset = C * (1 - v / 100); }));
}

/* =====================================================================
   ИИ-ТЬЮТОР (пошаговый разбор ошибки)
   ===================================================================== */
let T = { q: null, shown: 0, msgs: [], typing: false, used: {}, timers: [] };
const later = (fn, ms) => { T.timers.push(setTimeout(fn, RM ? 0 : ms)); };

function tutorShow(){
  $("#tutor").classList.add("open"); $("#tutor").setAttribute("aria-hidden", "false");
  $("#tscrim").classList.add("on"); document.body.classList.add("tutor-on");
}
function tutorHide(){
  $("#tutor").classList.remove("open"); $("#tutor").setAttribute("aria-hidden", "true");
  $("#tscrim").classList.remove("on"); document.body.classList.remove("tutor-on");
}
function tutorReset(){
  T.timers.forEach(clearTimeout);
  T = { q: null, shown: 0, msgs: [], typing: false, used: {}, timers: [] };
  tutorHide();
}
function tutorOpen(q, given){
  T.timers.forEach(clearTimeout);
  T = { q, shown: 0, msgs: [], typing: false, used: {}, timers: [] };
  T.msgs.push({ k: "text", html: `Ваш ответ: <strong>${fmt(given || "—")}</strong> — не совпал с правильным. Ничего страшного, разберём по шагам.` });
  tutorShow(); tRender();
  later(tutorNext, 550);
}
function tutorNext(){
  if (!T.q || T.typing) return;
  const st = T.q.explain.steps;
  if (T.shown >= st.length) return;
  T.typing = true; tRender();
  later(() => {
    T.typing = false;
    T.msgs.push({ k: "step", n: T.shown + 1, total: st.length, html: fmt(st[T.shown]) });
    T.shown++;
    if (T.shown >= st.length) T.msgs.push({ k: "final", html: `Итог: правильный ответ — <strong>${correctText(T.q)}</strong>. Когда будете готовы, переходите к следующему вопросу.` });
    tRender();
  }, 650);
}
function tutorSay(kind){
  if (!T.q || T.used[kind]) return;
  const e = T.q.explain, map = { hint: ["hint", "Подсказка", e.hint], simple: ["text", "Проще", e.simple], formula: ["fm", "Формула", e.formula] };
  const m = map[kind]; if (!m || !m[2]) return;
  T.used[kind] = true;
  T.msgs.push({ k: m[0], title: m[1], html: fmt(m[2]) });
  tRender();
}
function tRender(){
  const b = $("#tBody"); if (!b) return;
  b.innerHTML = T.msgs.map(m => {
    if (m.k === "step") return `<div class="tm step"><div class="tm-h">Шаг ${m.n} из ${m.total}</div>${m.html}</div>`;
    if (m.k === "fm") return `<div class="tm fm"><div class="tm-h">Формула</div>${m.html}</div>`;
    if (m.k === "hint") return `<div class="tm hint"><div class="tm-h">Подсказка</div>${m.html}</div>`;
    if (m.k === "final") return `<div class="tm final">${m.html}</div>`;
    return `<div class="tm">${m.title ? `<div class="tm-h">${m.title}</div>` : ""}${m.html}</div>`;
  }).join("") + (T.typing ? `<div class="tm typing" aria-label="Тьютор печатает"><i></i><i></i><i></i></div>` : "");
  const q = T.q, c = $("#tChips"); let h = "";
  if (q) {
    const more = T.shown < q.explain.steps.length;
    if (more && !T.typing) h += `<button class="chip pri" data-act="t-next">Следующий шаг</button>`;
    if (q.explain.hint) h += `<button class="chip" data-act="t-hint" ${T.used.hint ? "disabled" : ""}>Подсказка</button>`;
    if (q.explain.simple) h += `<button class="chip" data-act="t-simple" ${T.used.simple ? "disabled" : ""}>Объясни проще</button>`;
    if (q.explain.formula) h += `<button class="chip" data-act="t-formula" ${T.used.formula ? "disabled" : ""}>Формула</button>`;
    h += `<button class="chip ${more ? "" : "pri"}" data-act="t-hide">Понятно</button>`;
  }
  c.innerHTML = h;
  b.scrollTo({ top: b.scrollHeight, behavior: RM ? "auto" : "smooth" });
}

/* =====================================================================
   ПРОЧЕЕ: тосты, маршрутизация, события
   ===================================================================== */
function toast(msg){
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 320); }, 2200);
}

function refreshView(){
  if (R.name === "bookmarks") $("#view").innerHTML = bookmarksHTML();
  else if (R.name === "lesson") { const l = $("#lact"); if (l) l.innerHTML = actionsHTML(curLesson()); }
  else if (R.name === "home") { $("#view").innerHTML = homeHTML(); animateRing(); }
}

function route(){
  stopTimer(); tutorReset(); Q = null; R = parseHash(); closeSidebar();
  renderTopbar(); renderTree(); renderNav();
  const v = $("#view");
  if (R.name === "home") { v.innerHTML = homeHTML(); animateRing(); document.title = "NEXUS — платформа подготовки к экзаменам"; }
  else if (R.name === "bookmarks") { v.innerHTML = bookmarksHTML(); document.title = "Избранное · NEXUS"; }
  else { v.innerHTML = lessonHTML(); document.title = LMAP[R.id].lesson.title + " · NEXUS"; if (R.tab === "quiz") renderQuiz(); }
  $("#main").scrollTo({ top: 0, behavior: "auto" });
  renderNav();
}

function toggleBookmark(id){
  if (!id || !LMAP[id]) return;
  if (state.bookmarks[id]) delete state.bookmarks[id]; else state.bookmarks[id] = true;
  save(); renderTree(); renderNav(); refreshView();
  toast(state.bookmarks[id] ? "Добавлено в избранное" : "Убрано из избранного");
}

let resetArmed = null;
const handlers = {
  toggle(el){ const k = el.dataset.key; state.open[k] = state.open[k] === false; save(); renderTree(); },
  bm(el){ toggleBookmark(el.dataset.id); },
  menu(){ openSidebar(); },
  scrim(){ closeSidebar(); },
  "f-course"(el){ F.course = el.dataset.v || null; renderFilters(); renderTree(); },
  "f-tag"(el){ F.tag = F.tag === el.dataset.v ? null : el.dataset.v; renderFilters(); renderTree(); },
  "f-fav"(){ F.fav = !F.fav; renderFilters(); renderTree(); },
  "f-reset"(){ F.q = ""; F.tag = null; F.course = null; F.fav = false; $("#search").value = ""; renderFilters(); renderTree(); },
  done(){
    const id = R.id; state.done[id] = !state.done[id]; save();
    renderTree(); renderTopbar(); refreshView();
    toast(state.done[id] ? "Урок отмечен изученным" : "Отметка снята");
  },
  "q-start"(){ startQuiz(null, true); },
  "q-again"(){ startQuiz(null, true); },
  "q-wrong"(){ startQuiz(Q.answers.filter(a => !a.ok).map(a => a.qi), false); },
  "q-check"(){ submitAnswer(); },
  "q-next"(){ nextQ(); },
  opt(el){ pickOption(+el.dataset.i); },
  "timer-toggle"(){ state.timer = !state.timer; save(); renderQuiz(); },
  "t-open"(){
    const q = curQ();
    if (!q) return;
    if (T.q === q) { tutorShow(); tRender(); }
    else tutorOpen(q, Q.answers[Q.pos] ? Q.answers[Q.pos].given : "");
  },
  "t-hide"(){ tutorHide(); },
  "t-next"(){ tutorNext(); },
  "t-hint"(){ tutorSay("hint"); },
  "t-simple"(){ tutorSay("simple"); },
  "t-formula"(){ tutorSay("formula"); },
  reset(el){
    if (!resetArmed) {
      resetArmed = setTimeout(() => { resetArmed = null; const b = $("#resetBtn"); if (b) b.textContent = "Сбросить прогресс"; }, 4000);
      el.textContent = "Нажмите ещё раз — прогресс будет удалён";
      return;
    }
    clearTimeout(resetArmed); resetArmed = null;
    state = defaults(); save();
    renderTree(); renderTopbar(); renderNav(); refreshView();
    toast("Прогресс сброшен");
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const h = handlers[el.dataset.act];
  if (h) { if (el.tagName === "BUTTON") e.preventDefault(); h(el, e); }
});

document.addEventListener("input", e => {
  if (e.target.id === "search") { F.q = e.target.value; renderTree(); }
  else if (e.target.id === "qin" && Q) Q.input = e.target.value;
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { tutorHide(); closeSidebar(); return; }
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  if ((e.key === "/" && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
    e.preventDefault(); openSidebar(); $("#search").focus(); return;
  }
  if (typing) {
    if (e.target.id === "qin" && e.key === "Enter") { e.preventDefault(); submitAnswer(); }
    return;
  }
  if (R.name !== "lesson" || R.tab !== "quiz" || !Q || Q.phase === "done") return;
  if (tag === "button" || tag === "a") { if (e.key === "Enter" || e.key === " ") return; }
  if (Q.phase === "ask") {
    const q = curQ(), n = parseInt(e.key, 10);
    if (q && q.options && n >= 1 && n <= q.options.length) pickOption(n - 1);
    else if (e.key === "Enter" && q && q.type === "multi" && Q.sel.length) submitAnswer();
  } else if (Q.phase === "checked" && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault(); nextQ();
  }
});

$("#main").addEventListener("scroll", () => {
  const m = $("#main"), p = $("#rp"); if (!p) return;
  const max = m.scrollHeight - m.clientHeight;
  p.style.width = (max > 0 ? Math.min(100, m.scrollTop / max * 100) : 0) + "%";
}, { passive: true });

window.addEventListener("hashchange", route);
renderFilters();
route();
</script>
</body>
